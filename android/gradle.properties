org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# O AGP 8.x não roda em JDK acima do 21. Se o `java -version` da sua máquina
# for mais novo, aponte o JDK 21 em android/local.properties (que não é
# versionado), na linha:
#     org.gradle.java.home=/caminho/para/jdk-21

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
